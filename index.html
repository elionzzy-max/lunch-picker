<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>今天吃啥</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@700;900&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* 布局：单列工具页 —— 提问 → 结果 → 一周安排 → 餐厅库，宽屏时一周安排五列横排 */
:root{
  --bg:#F2F5F1; --surface:#FFFFFF; --sunken:#E8EDE7;
  --ink:#1B2420; --muted:#5D6B63; --line:#D8E0D9;
  --accent:#1F6B4F; --accent-soft:#DCEDE4; --accent-ink:#FFFFFF;
  --mark:#E4A72A; --mark-soft:#FBEFD3; --warn:#B9481A; --warn-soft:#F8E3D9;
  --f-display:"Noto Serif SC","Songti SC",serif;
  --f-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111614; --surface:#19201D; --sunken:#0D1210;
  --ink:#E5ECE7; --muted:#94A39A; --line:#2A3430;
  --accent:#4FB38A; --accent-soft:#1D3329; --accent-ink:#0B1712;
  --mark:#E9B949; --mark-soft:#3A3020; --warn:#F07A4A; --warn-soft:#3B241A;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#111614; --surface:#19201D; --sunken:#0D1210;
  --ink:#E5ECE7; --muted:#94A39A; --line:#2A3430;
  --accent:#4FB38A; --accent-soft:#1D3329; --accent-ink:#0B1712;
  --mark:#E9B949; --mark-soft:#3A3020; --warn:#F07A4A; --warn-soft:#3B241A;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.6}
.wrap{max-width:1040px;margin:0 auto;padding-inline:16px;padding-block:28px calc(96px + env(safe-area-inset-bottom,0px))}
h1,h2{font-family:var(--f-display);margin:0;text-wrap:balance}
h1{font-size:34px;font-weight:900;letter-spacing:.02em}
h2{font-size:20px;font-weight:700}
.sub{color:var(--muted);margin:4px 0 0}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.label{font-size:12px;color:var(--muted);letter-spacing:.06em}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.sec-head p{margin:0;color:var(--muted);font-size:13px}

button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 14px;transition:background .15s,border-color .15s}
button:hover{border-color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--mark);outline-offset:2px}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn-primary:hover{filter:brightness(1.08)}
.btn-ghost{background:transparent}
.btn-danger{color:var(--warn);border-color:var(--warn-soft);background:transparent}
.btn-danger:hover{border-color:var(--warn)}
.btn-sm{padding:4px 10px;font-size:12px}
input[type=text],input[type=number],select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}

/* ---------- 提问 ---------- */
.ask{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:16px}
.ask-row{display:flex;gap:10px;flex-wrap:wrap}
.ask-row input{flex:1 1 240px;font-size:16px;padding:11px 14px}
.ask-row .btn-primary{padding:11px 22px;font-size:15px}
.cover{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
.cover button{padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;gap:0;line-height:1.2;border-radius:8px}
.cover .n{font-family:var(--f-num);font-weight:700;font-size:15px}
.cover .c{font-size:11px;color:var(--muted)}
.cover button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.cover button.on .c{color:var(--accent-ink);opacity:.85}
.cover button.zero{background:var(--warn-soft);border-color:transparent}
.cover button.zero .c{color:var(--warn)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted)}
.chip.on{background:var(--mark-soft);border-color:var(--mark);color:var(--ink)}

.result{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px}
@media (max-width:720px){.result{grid-template-columns:1fr}}
.pick{background:var(--accent-soft);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
.pick .q{font-size:13px;color:var(--muted)}
.pick .name{font-family:var(--f-display);font-size:32px;font-weight:900;line-height:1.2}
.pick .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pick .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;align-items:center}
.pick.spin .name{animation:flick .45s ease}
@keyframes flick{0%{opacity:0;transform:translateY(8px)}100%{opacity:1;transform:none}}
.pill{font-size:12px;padding:2px 8px;border-radius:6px;background:var(--surface);color:var(--muted);border:1px solid var(--line)}
.pill.ppl{color:var(--accent);border-color:var(--accent);font-family:var(--f-num)}
.others{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;min-width:0}
.others ul{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column}
.others li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);cursor:pointer}
.others li:first-child{border-top:0}
.others li:hover .nm{color:var(--accent)}
.others .nm{font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{color:var(--muted);padding:18px;border:1px dashed var(--line);border-radius:14px;text-align:center}
.empty.warn{color:var(--warn);border-color:var(--warn)}

/* ---------- 一周 ---------- */
.week{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
@media (max-width:820px){.week{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}}
.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.day.locked{border-color:var(--mark);box-shadow:inset 0 3px 0 var(--mark)}
.day-top{display:flex;justify-content:space-between;align-items:center}
.day-top b{font-family:var(--f-display);font-size:17px}
.day .rest{font-family:var(--f-display);font-weight:700;font-size:18px;min-height:2.6em;line-height:1.3;display:flex;align-items:center}
.day .rest.none{color:var(--muted);font-family:var(--f-body);font-weight:400;font-size:13px}
.day .rest.bad{color:var(--warn)}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:26px;height:26px;padding:0;display:grid;place-items:center;line-height:1}
.stepper .num{min-width:2.4em;text-align:center}
.day select{font-size:13px;padding:6px 8px}
.lock{font-size:12px;padding:2px 8px;border-radius:6px}
.lock.on{background:var(--mark-soft);border-color:var(--mark)}

/* ---------- 餐厅库 ---------- */
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.editing{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.card-top .nm{font-family:var(--f-display);font-weight:700;font-size:18px;line-height:1.3;min-width:0;overflow-wrap:anywhere}
.card .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.card .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.card .acts .grow{margin-right:auto}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.fields2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.new-card{border-style:dashed;background:transparent}
.tag-ex{font-size:11px;color:var(--mark);border:1px solid var(--mark);border-radius:4px;padding:0 5px;margin-left:6px;vertical-align:middle;font-family:var(--f-body);font-weight:500}

/* 双滑块 */
.r2-wrap{display:flex;flex-direction:column;gap:2px}
.r2-head{display:flex;justify-content:space-between;align-items:baseline}
.r2-head .val{font-family:var(--f-num);font-weight:700;color:var(--accent)}
.r2-head .lk{font-size:11px;color:var(--muted)}
.r2{position:relative;height:28px}
.r2-track{position:absolute;left:10px;right:10px;top:12px;height:4px;border-radius:2px;background:var(--sunken)}
.r2-fill{position:absolute;top:0;bottom:0;background:var(--accent);border-radius:2px}
.r2 input{position:absolute;left:0;top:0;width:100%;height:28px;margin:0;background:none;pointer-events:none;-webkit-appearance:none;appearance:none}
.r2 input::-webkit-slider-runnable-track{background:transparent;height:28px}
.r2 input::-moz-range-track{background:transparent}
.r2 input::-webkit-slider-thumb{-webkit-appearance:none;pointer-events:auto;width:20px;height:20px;margin-top:4px;border-radius:50%;background:var(--surface);border:3px solid var(--accent);cursor:grab}
.r2 input::-moz-range-thumb{pointer-events:auto;width:14px;height:14px;border-radius:50%;background:var(--surface);border:3px solid var(--accent);cursor:grab}
.r2 input:focus-visible{outline:none}
.r2 input:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 3px var(--mark)}
.r2.locked .r2-fill{background:var(--muted)}
.r2.locked input::-webkit-slider-thumb{width:10px;height:10px;margin-top:9px;border:0;background:var(--muted);cursor:not-allowed}
.r2.locked input::-moz-range-thumb{width:10px;height:10px;border:0;background:var(--muted);cursor:not-allowed}
.r2-ticks{display:flex;justify-content:space-between;padding:0 6px;font-family:var(--f-num);font-size:10px;color:var(--muted)}
.r2-ticks span{width:8px;text-align:center}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.foot{margin-top:12px;color:var(--muted);font-size:12px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:480px){h1{font-size:28px}.pick .name{font-size:26px}.cover{grid-template-columns:repeat(5,1fr)}}

/* 底部 TAB */
.page{display:flex;flex-direction:column;gap:16px}
.page-head{margin-bottom:4px}
.week-bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;justify-content:center;background:var(--surface);border-top:1px solid var(--line);padding:6px 16px calc(6px + env(safe-area-inset-bottom,0px))}
.tabbar button{flex:1 1 0;max-width:160px;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;color:var(--muted);font-size:12px;border-radius:10px}
.tabbar svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabbar button[aria-current="page"]{color:var(--accent);font-weight:700}
.tabbar button[aria-current="page"] svg{stroke-width:2.2}
.tabbar button:hover{background:var(--sunken)}
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>

<div class="wrap">
  <!-- 推荐 -->
  <section class="page" data-page="ask">
    <header class="page-head">
      <h1>今天吃啥</h1>
      <p class="sub">说几个人，随机挑一家。</p>
    </header>
    <form class="ask" id="askForm">
      <div class="ask-row">
        <input type="text" id="askInput" placeholder="比如：3 个人吃什么？" autocomplete="off">
        <button type="submit" class="btn-primary">帮我挑</button>
      </div>
      <div>
        <div class="label" style="margin-bottom:8px">按人数 · 每格是能接待这么多人的餐厅数</div>
        <div class="cover" id="cover"></div>
      </div>
      <div>
        <div class="label" style="margin-bottom:6px">口味筛选（不选 = 全部）</div>
        <div class="chips" id="tagChips"></div>
      </div>
    </form>
    <div id="result"></div>
  </section>

  <!-- 一周 -->
  <section class="page" data-page="week" hidden>
    <header class="page-head">
      <h1>一周午饭</h1>
      <p class="sub">每天设好人数后随机分配；手动选的那天会自动锁住，随机不会覆盖。</p>
    </header>
    <div class="week-bar">
      <button type="button" class="btn-ghost" id="weekClear">清空未锁定</button>
      <button type="button" class="btn-primary" id="weekRandom">随机分配一周</button>
    </div>
    <div class="week" id="week"></div>
  </section>

  <!-- 餐厅库 -->
  <section class="page" data-page="lib" hidden>
    <header class="page-head">
      <h1>餐厅库 <span class="num" id="libCount" style="color:var(--muted);font-size:16px;font-weight:500"></span></h1>
      <p class="sub">点「编辑」才能改名字、口味、人均和人数范围，其余时候都锁着。</p>
    </header>
    <div class="lib" id="lib"></div>
    <footer class="foot">
      <span>数据只存在这台设备的浏览器里。</span>
      <button type="button" class="btn-sm btn-ghost" id="resetBtn">恢复示例数据</button>
      <span id="resetConfirm" hidden>确定清空并恢复示例？<button type="button" class="btn-sm btn-danger" id="resetYes">恢复</button> <button type="button" class="btn-sm btn-ghost" id="resetNo">算了</button></span>
    </footer>
  </section>
</div>

<nav class="tabbar" id="tabbar" aria-label="功能切换">
  <button type="button" data-tab="ask" aria-current="page">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5v4.5l3 2"/></svg>
    <span>推荐</span>
  </button>
  <button type="button" data-tab="week">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
    <span>一周</span>
  </button>
  <button type="button" data-tab="lib">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h16M6 20V9l6-5 6 5v11"/><path d="M10 20v-5h4v5"/></svg>
    <span>餐厅库</span>
  </button>
</nav>
<div class="toast" id="toast"></div>

<script>
const KEY = 'lunch-picker-v1';
const MAXP = 10;
const DAYS = ['周一','周二','周三','周四','周五'];

const uid = () => Math.random().toString(36).slice(2, 9);
function seed(){
  const R = (name, tags, min, max, price) => ({ id: uid(), name, tags, min, max, price, sample: true });
  return {
    restaurants: [
      R('楼下兰州拉面', ['面食','快'], 1, 3, 28),
      R('一人食日料定食', ['日料','快'], 1, 2, 55),
      R('赛百味', ['轻食','快'], 1, 4, 35),
      R('老乡鸡', ['中式快餐'], 1, 6, 32),
      R('海底捞', ['火锅'], 2, 10, 120),
      R('西贝莜面村', ['西北菜'], 3, 10, 95),
      R('太二酸菜鱼', ['川菜'], 2, 4, 80),
      R('湘菜小馆', ['湘菜','下饭'], 3, 8, 70),
      R('烤肉自助', ['烤肉'], 4, 10, 110),
    ],
    week: DAYS.map(() => ({ people: 2, rid: null, locked: false })),
  };
}
function load(){ try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.restaurants && s.week) return s; } catch(e){} return null; }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }

let S = load() || seed();
let ask = { people: 2, tags: new Set(), pickId: null, q: '' };
let editingId = null;

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const byId = id => S.restaurants.find(r => r.id === id);
const fits = (r, n) => n >= r.min && n <= r.max;
const pctOf = v => (v - 1) / (MAXP - 1) * 100;
const rangeText = r => r.min === r.max ? `${r.min} 人` : `${r.min}–${r.max} 人`;
const rand = arr => arr[Math.floor(Math.random() * arr.length)];

function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('show'), 1600); }

/* ---------- 问句解析：3个人 / 三个人 / 两人 / 10人 ---------- */
const CN = {'一':1,'两':2,'二':2,'俩':2,'三':3,'仨':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9,'十':10};
function parsePeople(q){
  let m = q.match(/(\d+)\s*(个)?\s*(人|位)?/);
  if (m) return +m[1];
  m = q.match(/([一两二俩三仨四五六七八九十])\s*(个)?\s*(人|位)/);
  if (m) return CN[m[1]];
  if (/自己|一个人|我一人|单人/.test(q)) return 1;
  return null;
}

function candidates(n, tags = ask.tags){
  return S.restaurants.filter(r => fits(r, n) && (tags.size === 0 || r.tags.some(t => tags.has(t))));
}

/* ---------- 提问区 ---------- */
function renderCover(){
  $('#cover').innerHTML = Array.from({length: MAXP}, (_, i) => {
    const n = i + 1, c = candidates(n).length;
    return `<button type="button" data-n="${n}" class="${n === ask.people ? 'on' : ''} ${c === 0 ? 'zero' : ''}" aria-label="${n} 人，${c} 家"><span class="n">${n}</span><span class="c">${c} 家</span></button>`;
  }).join('');
}
function allTags(){ return [...new Set(S.restaurants.flatMap(r => r.tags))]; }
function renderTags(){
  for (const t of [...ask.tags]) if (!allTags().includes(t)) ask.tags.delete(t);
  $('#tagChips').innerHTML = allTags().map(t => `<button type="button" class="chip ${ask.tags.has(t) ? 'on' : ''}" data-tag="${esc(t)}">${esc(t)}</button>`).join('');
}
function pick(){
  const list = candidates(ask.people);
  const pool = list.length > 1 ? list.filter(r => r.id !== ask.pickId) : list;
  ask.pickId = pool.length ? rand(pool).id : null;
  renderResult(true);
}
function renderResult(animate){
  const n = ask.people, list = candidates(n), p = byId(ask.pickId);
  const el = $('#result');
  if (!list.length){
    el.innerHTML = `<div class="empty warn">还没有适合 <b class="num">${n}</b> 人的餐厅${ask.tags.size ? '（在当前口味筛选下）' : ''}，去下面的餐厅库录入一家，或者把某家的人数范围调大。</div>`;
    return;
  }
  if (!p || !fits(p, n) || !list.includes(p)){ ask.pickId = rand(list).id; return renderResult(animate); }
  const others = list.filter(r => r.id !== p.id);
  el.innerHTML = `
    <div class="result">
      <div class="pick ${animate ? 'spin' : ''}">
        <div class="q">${esc(ask.q || `${n} 个人吃什么？`)}</div>
        <div class="name">${esc(p.name)}</div>
        <div class="meta">
          <span class="pill ppl">适合 ${rangeText(p)}</span>
          ${p.price ? `<span class="pill num">人均 ¥${p.price}</span>` : ''}
          ${p.tags.map(t => `<span class="pill">${esc(t)}</span>`).join('')}
        </div>
        <div class="acts">
          <button type="button" class="btn-primary" id="reroll">换一家</button>
          <span class="label" style="margin-left:4px">排进：</span>
          ${DAYS.map((d, i) => `<button type="button" class="btn-sm" data-assign="${i}">${d}</button>`).join('')}
        </div>
      </div>
      <div class="others">
        <div class="label">同样适合 ${n} 人的还有 <span class="num">${others.length}</span> 家</div>
        ${others.length ? `<ul>${others.map(r => `<li data-pick="${r.id}"><span class="nm">${esc(r.name)}</span><span class="num" style="color:var(--muted);font-size:12px;white-space:nowrap">${rangeText(r)}${r.price ? ' · ¥' + r.price : ''}</span></li>`).join('')}</ul>` : `<p class="sub" style="font-size:13px">只有这一家，可以多录入几家。</p>`}
      </div>
    </div>`;
}

$('#askForm').addEventListener('submit', e => {
  e.preventDefault();
  const q = $('#askInput').value.trim();
  const n = parsePeople(q);
  if (n !== null){
    if (n < 1 || n > MAXP){ toast(`目前只支持 1–${MAXP} 人`); return; }
    ask.people = n;
  }
  ask.q = q && n !== null ? q : '';
  renderCover(); pick();
});
$('#cover').addEventListener('click', e => {
  const b = e.target.closest('button[data-n]'); if (!b) return;
  ask.people = +b.dataset.n; ask.q = ''; renderCover(); pick();
});
$('#tagChips').addEventListener('click', e => {
  const b = e.target.closest('[data-tag]'); if (!b) return;
  const t = b.dataset.tag; ask.tags.has(t) ? ask.tags.delete(t) : ask.tags.add(t);
  renderTags(); renderCover(); pick();
});
$('#result').addEventListener('click', e => {
  if (e.target.closest('#reroll')) return pick();
  const li = e.target.closest('[data-pick]');
  if (li){ ask.pickId = li.dataset.pick; return renderResult(true); }
  const a = e.target.closest('[data-assign]');
  if (a){
    const d = S.week[+a.dataset.assign];
    Object.assign(d, { rid: ask.pickId, people: ask.people, locked: true });
    save(); renderWeek(); toast(`已排进${DAYS[+a.dataset.assign]}，并锁定，可在「一周」查看`);
  }
});

/* ---------- 一周 ---------- */
function renderWeek(){
  $('#week').innerHTML = S.week.map((d, i) => {
    const r = byId(d.rid);
    const ok = r && fits(r, d.people);
    const fit = S.restaurants.filter(x => fits(x, d.people));
    const unfit = S.restaurants.filter(x => !fits(x, d.people));
    const opt = x => `<option value="${x.id}" ${x.id === d.rid ? 'selected' : ''}>${esc(x.name)}（${rangeText(x)}）</option>`;
    return `
      <div class="day ${d.locked ? 'locked' : ''}" data-day="${i}">
        <div class="day-top">
          <b>${DAYS[i]}</b>
          <button type="button" class="lock ${d.locked ? 'on' : ''}" data-act="lock" aria-pressed="${d.locked}">${d.locked ? '已锁定' : '未锁定'}</button>
        </div>
        <div class="stepper">
          <button type="button" data-act="minus" aria-label="减少人数">−</button>
          <span class="num"><b>${d.people}</b> 人</span>
          <button type="button" data-act="plus" aria-label="增加人数">+</button>
        </div>
        <div class="rest ${!r ? 'none' : ok ? '' : 'bad'}">${r ? esc(r.name) : (fit.length ? '还没安排' : `没有适合 ${d.people} 人的餐厅`)}</div>
        ${r && !ok ? `<div style="font-size:12px;color:var(--warn);margin-top:-6px">这家只适合 ${rangeText(r)}</div>` : ''}
        <select id="day-sel-${i}" data-act="select" aria-label="${DAYS[i]}手动选择餐厅">
          <option value="">— 手动选择 —</option>
          ${fit.length ? `<optgroup label="适合 ${d.people} 人">${fit.map(opt).join('')}</optgroup>` : ''}
          ${unfit.length ? `<optgroup label="人数不合适">${unfit.map(opt).join('')}</optgroup>` : ''}
        </select>
        <button type="button" class="btn-sm" data-act="reroll" ${d.locked ? 'disabled title="先解锁再随机"' : ''}>随机这天</button>
      </div>`;
  }).join('');
}
function rollDay(i, used){
  const d = S.week[i];
  const list = S.restaurants.filter(r => fits(r, d.people));
  const fresh = list.filter(r => !used.has(r.id));
  const r = rand(fresh.length ? fresh : list);
  d.rid = r ? r.id : null;
  if (r) used.add(r.id);
}
function usedExcept(i){ return new Set(S.week.filter((_, j) => j !== i).map(d => d.rid).filter(Boolean)); }

$('#weekRandom').addEventListener('click', () => {
  const used = new Set(S.week.filter(d => d.locked).map(d => d.rid).filter(Boolean));
  S.week.forEach((d, i) => { if (!d.locked) rollDay(i, used); });
  save(); renderWeek(); toast('已随机分配（锁定的天保持不变）');
});
$('#weekClear').addEventListener('click', () => {
  S.week.forEach(d => { if (!d.locked) d.rid = null; });
  save(); renderWeek();
});
$('#week').addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.tagName === 'SELECT') return;
  const i = +b.closest('[data-day]').dataset.day, d = S.week[i];
  const act = b.dataset.act;
  if (act === 'lock') d.locked = !d.locked;
  if (act === 'minus') d.people = Math.max(1, d.people - 1);
  if (act === 'plus') d.people = Math.min(MAXP, d.people + 1);
  if (act === 'reroll') rollDay(i, usedExcept(i));
  save(); renderWeek();
});
$('#week').addEventListener('change', e => {
  if (e.target.dataset.act !== 'select') return;
  const i = +e.target.closest('[data-day]').dataset.day, d = S.week[i];
  d.rid = e.target.value || null;
  d.locked = !!d.rid;
  save(); renderWeek();
});

/* ---------- 双滑块 ---------- */
function rangeHTML(r, locked){
  return `
    <div class="r2-wrap">
      <div class="r2-head"><span class="label">适合人数</span><span><span class="val" data-val>${rangeText(r)}</span>${locked ? ' <span class="lk">· 锁定</span>' : ''}</span></div>
      <div class="r2 ${locked ? 'locked' : ''}">
        <div class="r2-track"><div class="r2-fill" style="left:${pctOf(r.min)}%;right:${100 - pctOf(r.max)}%"></div></div>
        <input type="range" id="lo-${r.id}" class="lo" min="1" max="${MAXP}" step="1" value="${r.min}" ${locked ? 'disabled' : ''} aria-label="最少人数">
        <input type="range" id="hi-${r.id}" class="hi" min="1" max="${MAXP}" step="1" value="${r.max}" ${locked ? 'disabled' : ''} aria-label="最多人数">
      </div>
      <div class="r2-ticks">${Array.from({length: MAXP}, (_, i) => `<span>${i + 1}</span>`).join('')}</div>
    </div>`;
}
function bindRange(root){
  const lo = root.querySelector('.lo'), hi = root.querySelector('.hi');
  if (!lo || lo.disabled) return;
  const sync = src => {
    let a = +lo.value, b = +hi.value;
    if (a > b){ if (src === lo) hi.value = b = a; else lo.value = a = b; }
    // 两个滑块叠在一起时，让刚拖动的那个在上层
    lo.style.zIndex = src === lo ? 2 : 1; hi.style.zIndex = src === hi ? 2 : 1;
    root.querySelector('.r2-fill').style.left = pctOf(a) + '%';
    root.querySelector('.r2-fill').style.right = (100 - pctOf(b)) + '%';
    root.querySelector('[data-val]').textContent = rangeText({min: a, max: b});
  };
  lo.addEventListener('input', () => sync(lo));
  hi.addEventListener('input', () => sync(hi));
}

/* ---------- 餐厅库 ---------- */
const NEW = { id: 'new', name: '', tags: [], min: 1, max: 4, price: '' };
function cardHTML(r){
  const editing = editingId === r.id || r.id === 'new';
  if (!editing){
    return `
      <div class="card" data-id="${r.id}">
        <div class="card-top">
          <div class="nm">${esc(r.name)}${r.sample ? '<span class="tag-ex">示例</span>' : ''}</div>
          <button type="button" class="btn-sm" data-act="edit">编辑</button>
        </div>
        <div class="row">
          ${r.price ? `<span class="pill num">人均 ¥${r.price}</span>` : ''}
          ${r.tags.map(t => `<span class="pill">${esc(t)}</span>`).join('')}
        </div>
        ${rangeHTML(r, true)}
      </div>`;
  }
  const isNew = r.id === 'new';
  return `
    <div class="card editing ${isNew ? 'new-card' : ''}" data-id="${r.id}">
      ${isNew ? '<div class="nm" style="font-family:var(--f-display);font-weight:700;font-size:17px">录入新餐厅</div>' : ''}
      <label class="field"><span class="label">名字</span><input type="text" id="name-${r.id}" data-f="name" value="${esc(r.name)}" placeholder="比如：楼下麻辣烫"></label>
      <div class="fields2">
        <label class="field"><span class="label">口味（逗号分隔）</span><input type="text" id="tags-${r.id}" data-f="tags" value="${esc(r.tags.join('，'))}" placeholder="川菜，下饭"></label>
        <label class="field"><span class="label">人均 ¥</span><input type="number" id="price-${r.id}" data-f="price" min="0" value="${r.price ?? ''}" placeholder="50"></label>
      </div>
      ${rangeHTML(r, false)}
      <div class="acts">
        ${isNew ? '' : '<button type="button" class="btn-sm btn-danger grow" data-act="del">删除</button>'}
        ${isNew ? '' : '<button type="button" class="btn-sm btn-ghost" data-act="cancel">取消</button>'}
        <button type="button" class="btn-sm btn-primary" data-act="save">${isNew ? '录入' : '保存'}</button>
      </div>
    </div>`;
}
function renderLib(){
  $('#libCount').textContent = `· ${S.restaurants.length} 家`;
  $('#lib').innerHTML = cardHTML(NEW) + S.restaurants.map(cardHTML).join('');
  document.querySelectorAll('#lib .card').forEach(bindRange);
}
function readCard(card){
  const v = f => card.querySelector(`[data-f="${f}"]`).value.trim();
  return {
    name: v('name'),
    tags: v('tags').split(/[,，、\s]+/).filter(Boolean),
    price: v('price') === '' ? '' : Math.max(0, Math.round(+v('price'))),
    min: +card.querySelector('.lo').value,
    max: +card.querySelector('.hi').value,
  };
}
function refreshAll(){ renderTags(); renderCover(); renderResult(false); renderWeek(); renderLib(); }

$('#lib').addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const card = b.closest('.card'), id = card.dataset.id, act = b.dataset.act;
  if (act === 'edit'){ editingId = id; renderLib(); card.parentNode && $(`#name-${id}`)?.focus(); return; }
  if (act === 'cancel'){ editingId = null; renderLib(); return; }
  if (act === 'del'){
    if (b.dataset.confirm){
      S.restaurants = S.restaurants.filter(r => r.id !== id);
      S.week.forEach(d => { if (d.rid === id){ d.rid = null; d.locked = false; } });
      editingId = null; save(); refreshAll(); toast('已删除'); return;
    }
    b.dataset.confirm = '1'; b.textContent = '再点一次确认删除'; return;
  }
  if (act === 'save'){
    const data = readCard(card);
    if (!data.name){ toast('先填餐厅名字'); card.querySelector('[data-f="name"]').focus(); return; }
    if (id === 'new'){ S.restaurants.unshift({ id: uid(), ...data }); toast(`已录入「${data.name}」`); }
    else { const r = byId(id); Object.assign(r, data); delete r.sample; editingId = null; toast('已保存'); }
    save(); refreshAll();
  }
});

/* ---------- 重置 ---------- */
$('#resetBtn').addEventListener('click', () => { $('#resetConfirm').hidden = false; });
$('#resetNo').addEventListener('click', () => { $('#resetConfirm').hidden = true; });
$('#resetYes').addEventListener('click', () => {
  S = seed(); editingId = null; ask.tags.clear(); ask.pickId = null;
  $('#resetConfirm').hidden = true; save(); refreshAll(); pick(); toast('已恢复示例数据');
});

/* ---------- 底部 TAB ---------- */
function showTab(name){
  document.querySelectorAll('.page').forEach(p => p.hidden = p.dataset.page !== name);
  document.querySelectorAll('#tabbar [data-tab]').forEach(b => b.dataset.tab === name ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current'));
  window.scrollTo(0, 0);
  try { localStorage.setItem(KEY + '-tab', name); } catch(e){}
}
$('#tabbar').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (b) showTab(b.dataset.tab); });
let startTab = 'ask';
try { const t = localStorage.getItem(KEY + '-tab'); if (['ask','week','lib'].includes(t)) startTab = t; } catch(e){}

refreshAll(); pick(); showTab(startTab);
</script>
</body>
</html>
